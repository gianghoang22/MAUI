name: Validate VocabMate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Restore
        run: dotnet restore MauiApp1.slnx
      - name: Run core tests
        run: dotnet test MauiApp1.Tests/MauiApp1.Tests.csproj --no-restore --configuration Release
      - name: Build Android
        run: dotnet build MauiApp1/MauiApp1.csproj --no-restore --configuration Release --framework net10.0-android
      - name: Build Windows
        run: dotnet build MauiApp1/MauiApp1.csproj --no-restore --configuration Release --framework net10.0-windows10.0.19041.0
